      </div>
      <nav id="nav">
        <a href="#/" data-nav="dashboard"><span>▦</span>Übersicht</a>
        <div class="nav-group">CRM</div>
        <a href="#/kunden" data-nav="kunden"><span>👥</span>Kunden &amp; Interessenten</a>
        <a href="#/crm" data-nav="crm"><span>☎</span>Kontakte &amp; Wiedervorlagen</a>
        <div class="nav-group">Service</div>
        <a href="#/geraete" data-nav="geraete"><span>⛟</span>Geräte &amp; Prüffristen</a>

        </form>
        <div class="quick">
          <a class="btn btn-accent" href="#/auftraege/neu">+ Auftrag</a>

      <main id="view" class="view"></main>
